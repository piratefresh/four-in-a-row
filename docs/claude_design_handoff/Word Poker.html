<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; font-family: Inter, system-ui, sans-serif; }
  button { font-family: inherit; }
  /* range slider styling */
  input[type=range] { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; outline: none; -webkit-appearance: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #d4af37; border-radius: 50%; border: 2px solid #000; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: #d4af37; border-radius: 50%; border: 2px solid #000; cursor: pointer; }
</style>
