# P0: Successful fixed buy-in
#
# Verifies the complete buy-in flow for a balance game:
# 1. Wallet and buy-in are displayed before joining
# 2. Confirming the join deducts exactly the buy-in amount
# 3. The initial table stack equals the buy-in
# 4. Reopening/reconnecting does not charge again
#
# Precondition: wallet is seeded at exactly 1,000 coins.
# Table buy-in is 500.

url: http://localhost:3000
---
- launchApp
- assertVisible: "Online Mode"

# Step 1: Navigate to wallet page and verify pre-join balance
- tapOn: "Wallet"
- assertVisible: "1,000 coins"
- tapOn: "Play"

# Step 2: Join a balance table
# The E2E setup creates a table with buyIn = 500.
# Click the table card to join.
# A buy-in confirmation should appear showing the 500 buy-in.

# Step 3: Confirm buy-in
# Check that confirm is enabled and pressing it deducts 500.

# Step 4: Verify post-join state
# - Wallet should be 500
# - Table stack should be 500
# - Reopening should not charge again
