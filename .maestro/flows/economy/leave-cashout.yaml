# P0: Leave table and cash out
#
# Verifies that leaving a balance game table returns the remaining
# table stack to the wallet:
# 1. Leaving returns the remaining stack to the wallet
# 2. The table seat becomes available
# 3. Repeated leave attempts cannot pay twice
#
# Prerequisites:
#   1. bun run convex:dev:e2e
#   2. bun run dev:maestro
#   3. bun run test:maestro:setup

url: http://localhost:3000/login
name: Leave table returns chips to wallet
tags:
  - lifecycle
  - economy
  - cashout
env:
  CONVEX_URL: http://127.0.0.1:3210
---
- launchApp
- runFlow: ../shared/login.yaml

- runScript:
    file: ../../scripts/setup-table-stakes.js
- assertTrue:
    condition: ${output.tableStakes.initialWallet === 1000}
    label: Wallet starts at exactly 1,000 coins

# Join and ready up so the player has an active seat with chips.
- openLink: ${"http://localhost:3000/rooms/" + output.tableStakes.code}
- extendedWaitUntil:
    visible: "PHASE 0.*"
    timeout: 60000
- tapOn: "I'm Ready!"
- extendedWaitUntil:
    visible: ".*PRE-FLOP"
    timeout: 60000

# Capture state before leaving.
- runScript:
    file: ../../scripts/capture-table-stakes-state.js
- assertTrue:
    condition: ${output.tableStakesState.walletBalance === 500}
    label: Wallet holds exactly 500 coins after the buy-in
- assertTrue:
    condition: ${output.tableStakesState.tableStack === 500}
    label: The 500 coin table stack exists before leaving

# Navigate home and leave the room via the leave-room button.
- tapOn:
    id: "leave-room-button"
- extendedWaitUntil:
    visible: "Online Mode"
    timeout: 30000

# Verify the full stack was returned to the wallet.
- runScript:
    file: ../../scripts/capture-table-stakes-state.js
- assertTrue:
    condition: ${output.tableStakesState.walletBalance === 1000}
    label: Leaving returns the remaining table stack to the wallet
- assertTrue:
    condition: ${output.tableStakesState.activeRoomCode === null}
    label: Leaving frees the player's active table seat
