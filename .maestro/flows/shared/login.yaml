# Shared: Login as E2E test user
#
# Prerequisite: Convex is running with E2E_TESTING=true and the
# E2E account has been provisioned via `bun run test:maestro:setup`.
#
# This subflow navigates to /login, waits for auth state to resolve,
# fills credentials if needed, and verifies the user lands on home.

url: http://localhost:3000/login
---
- launchApp

# Wait for the auth check to resolve — Better Auth is async, so the
# page may briefly show neither form nor "signed in" state.
- extendedWaitUntil:
    visible: "Email|You're signed in"
    timeout: 15000

- runFlow:
    when:
      visible:
        id: "email"
    commands:
      - tapOn:
          id: "email"
      - inputText: "e2e-test@wordpoker.app"
      - tapOn:
          id: "password"
      - inputText: "E2eTest1234!"
      - tapOn:
          text: "Sign in with Email"
- runFlow:
    when:
      visible: "Go to home"
    commands:
      - tapOn: "Go to home"
- assertVisible: "Online Mode"
