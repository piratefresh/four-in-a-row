# P1: Disconnect expiry
#
# Verifies that a disconnected player is removed after the
# timeout period:
# 1. Player presence expires
# 2. Remaining stack is cashed out to wallet
# 3. Seat becomes available
#
# Note: Maestro's killApp does not simulate process death.
# Disconnect expiry is driven by guarded E2E presence fixtures
# (e2eExpirePlayerPresence), while Playwright covers real page
# close/reload behavior.

url: http://localhost:3000
---
- launchApp
- assertVisible: "Online Mode"

# Precondition: player is at a table. The provisioning script
# calls e2eExpirePlayerPresence to simulate timeout.
# Step 1: Verify the player is removed from the seat
# Step 2: Verify wallet received the cash-out (remaining stack)
# Step 3: Verify the seat is available for a new player
