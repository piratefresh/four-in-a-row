# Shared STO-249 setup: seed, join, buy in, and start a balance hand.
# The caller must already be authenticated.

url: http://localhost:3000/rooms
---
- runScript:
    file: ../scripts/setup-table-stakes.js

- openLink: http://localhost:3000/rooms
- extendedWaitUntil:
    visible: "STO-249 Table Stakes"
    timeout: 30000
- tapOn: "STO-249 Table Stakes"
- assertVisible: "Wallet balance"
- tapOn: "Join table"
- assertVisible: "Confirm your buy-in"
- tapOn: "Confirm & Join"

- extendedWaitUntil:
    visible: "PHASE 0.*"
    timeout: 60000
- tapOn: "I'm Ready!"
- extendedWaitUntil:
    visible: ".*PRE-FLOP"
    timeout: 60000
